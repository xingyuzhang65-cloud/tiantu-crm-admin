<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>询价与报价 - 跨境物流CRM</title>
<link rel="stylesheet" href="/tiantu-crm-admin/web/static/css/style.css">
<script src="/tiantu-crm-admin/web/static/admin-pages.js"></script>
<style>
body{background:#f0f4f8}.main{width:100%;margin:0;padding:24px}.page-head,.toolbar,.segment,.card-head,.card-foot{display:flex;align-items:center}.page-head{justify-content:space-between;margin-bottom:18px}.page-title{font-size:22px}.page-sub{font-size:12px;color:#64748b;margin-top:3px}.segment{width:max-content;padding:4px;background:#e2e8f0;border-radius:7px;margin-bottom:16px}.segment button{border:0;background:transparent;padding:8px 24px;border-radius:5px;color:#64748b;cursor:pointer}.segment button.active{background:#fff;color:#1d4ed8;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}.toolbar{gap:10px;margin-bottom:16px;flex-wrap:wrap}.search{min-width:260px;flex:1;max-width:420px}.filter-chip{padding:7px 13px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;color:#64748b;cursor:pointer}.filter-chip.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.inquiry-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.business-card{background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:17px}.card-head{justify-content:space-between;gap:10px}.number{font-size:12px;font-family:ui-monospace,monospace;color:#64748b}.company{font-size:16px;font-weight:650;margin:10px 0 3px}.route{font-size:13px;color:#1d4ed8}.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;padding:12px;background:#f8fafc;border-radius:5px}.details small{display:block;color:#94a3b8}.details strong{display:block;margin-top:3px;font-size:13px}.remark{min-height:24px;font-size:12px;color:#64748b}.card-foot{justify-content:space-between;margin-top:13px;padding-top:12px;border-top:1px solid #f1f5f9}.owner{font-size:12px;color:#64748b}.quotation-price{font-size:21px;font-weight:700;color:#0f766e}.empty{grid-column:1/-1;text-align:center;padding:70px;color:#94a3b8}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.parse-box{padding:11px;margin:10px 0;background:#eff6ff;color:#1e40af;border-radius:6px;font-size:12px}.share-preview{padding:16px;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:6px;line-height:1.8}.hidden{display:none!important}@media(max-width:850px){.main{padding:16px}.inquiry-list{grid-template-columns:1fr}.modal-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="main">
  <div class="page-head">
    <div><h1 class="page-title">询价与报价工作台</h1><div class="page-sub">承接 APP 端客户询价，统一核价、报价和对客分享</div></div>
    <button class="btn btn-primary" onclick="openCreate()">＋ 新建询价</button>
  </div>
  <div class="segment"><button class="active" data-tab="inquiry" onclick="setTab('inquiry',this)">客户询价</button><button data-tab="quotation" onclick="setTab('quotation',this)">我的报价</button></div>
  <div id="inquiryToolbar" class="toolbar">
    <input id="searchInput" class="form-input search" placeholder="搜索询价单、客户、线路或品名" oninput="loadInquiries()">
    <button class="filter-chip active" data-status="" onclick="setFilter('',this)">全部</button>
    <button class="filter-chip" data-status="new" onclick="setFilter('new',this)">待受理</button>
    <button class="filter-chip" data-status="pricing" onclick="setFilter('pricing',this)">核价中</button>
    <button class="filter-chip" data-status="quoted" onclick="setFilter('quoted',this)">已出价</button>
  </div>
  <div id="quotationToolbar" class="toolbar hidden"><span class="text-muted">报价单支持一键生成客户分享文案</span></div>
  <section id="cardList" class="inquiry-list"></section>
</main>
<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<script>
let activeTab='inquiry',activeStatus='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function json(url,options){return fetch(url,options).then(r=>r.json())}
function badge(item){const c={new:'badge-gray',pricing:'badge-yellow',quoted:'badge-blue',sent:'badge-blue',accepted:'badge-green',expired:'badge-red'}[item.status]||'badge-gray';return `<span class="badge ${c}">${esc(item.status_label)}</span>`}
function setTab(tab,button){activeTab=tab;document.querySelectorAll('.segment button').forEach(x=>x.classList.toggle('active',x===button));document.getElementById('inquiryToolbar').classList.toggle('hidden',tab!=='inquiry');document.getElementById('quotationToolbar').classList.toggle('hidden',tab!=='quotation');tab==='inquiry'?loadInquiries():loadQuotations()}
function setFilter(status,button){activeStatus=status;document.querySelectorAll('.filter-chip').forEach(x=>x.classList.toggle('active',x===button));loadInquiries()}
async function loadInquiries(){const q=new URLSearchParams({status:activeStatus,keyword:document.getElementById('searchInput').value});const r=await json('/api/inquiries/list?'+q);document.getElementById('cardList').innerHTML=r.inquiries.length?r.inquiries.map(i=>`<article class="business-card"><div class="card-head"><span class="number">${i.inquiry_no}</span>${badge(i)}</div><div class="company">${esc(i.customer_name)}</div><div class="route">${esc(i.route)} · ${esc(i.transport_mode)}</div><div class="details"><div><small>货物</small><strong>${esc(i.cargo_desc)}</strong></div><div><small>重量</small><strong>${Number(i.weight_kg||0).toLocaleString()} kg</strong></div><div><small>体积</small><strong>${esc(i.volume_cbm)} m³</strong></div></div><div class="remark">${esc(i.remark||'暂无补充要求')}</div><div class="card-foot"><span class="owner">${esc(i.owner)} · ${esc(i.created_at)}</span>${i.status==='quoted'?'<button class="btn btn-outline btn-sm" onclick="setTab(\'quotation\',document.querySelector(\'[data-tab=quotation]\'))">查看报价</button>':`<button class="btn btn-outline btn-sm" onclick="urge(${i.id})">催核价</button>`}</div></article>`).join(''):'<div class="empty">暂无符合条件的询价</div>'}
async function loadQuotations(){const r=await json('/api/quotations/list');document.getElementById('cardList').innerHTML=r.quotations.map(q=>`<article class="business-card"><div class="card-head"><span class="number">${q.quotation_no}</span>${badge(q)}</div><div class="company">${esc(q.customer_name)}</div><div class="route">${esc(q.route)} · ${esc(q.channel)}</div><div class="details"><div><small>报价金额</small><strong class="quotation-price">¥${Number(q.amount).toLocaleString()}</strong></div><div><small>有效期至</small><strong>${q.validity}</strong></div><div><small>创建时间</small><strong>${q.created_at.slice(5)}</strong></div></div><div class="card-foot"><span class="owner">含运输方案与服务条款</span><button class="btn btn-primary btn-sm" onclick='shareQuote(${JSON.stringify(q)})'>分享报价</button></div></article>`).join('')}
async function urge(id){const r=await json('/api/inquiries/'+id+'/urge',{method:'POST'});toast(r.msg);loadInquiries()}
function parseText(){const t=document.getElementById('pasteText').value;const val=(re,fallback='')=>(t.match(re)||[])[1]||fallback;document.getElementById('customer').value=val(/(?:客户|公司)[:：]\s*([^，,\n]+)/);document.getElementById('route').value=val(/(?:线路|路线|发往)[:：]?\s*([^，,\n]+)/);document.getElementById('cargo').value=val(/(?:品名|货物)[:：]\s*([^，,\n]+)/);document.getElementById('weight').value=val(/(?:重量)?\s*(\d+(?:\.\d+)?)\s*(?:kg|公斤)/i);document.getElementById('volume').value=val(/(?:体积)?\s*(\d+(?:\.\d+)?)\s*(?:方|cbm|m3)/i);document.getElementById('parseResult').textContent='已提取可识别字段，请确认后提交。'}
function openCreate(){openModal(`<h3>新建客户询价</h3><label>粘贴微信询价内容</label><textarea id="pasteText" placeholder="示例：客户：星海科技，线路：深圳-洛杉矶，品名：蓝牙音箱，重量 850kg，体积 5.2方"></textarea><button class="btn btn-outline btn-sm mt-2" onclick="parseText()">智能提取</button><div id="parseResult" class="parse-box">系统将自动识别客户、线路、品名、重量和体积</div><div class="modal-grid"><div><label>客户名称</label><input id="customer"></div><div><label>联系人</label><input id="contact"></div><div><label>运输线路</label><input id="route"></div><div><label>运输方式</label><select id="mode"><option>美森快船</option><option>海派</option><option>空派</option><option>中欧班列</option><option>卡航</option></select></div><div><label>货物品名</label><input id="cargo"></div><div><label>重量 (kg)</label><input id="weight" type="number"></div><div><label>体积 (m³)</label><input id="volume" type="number" step="0.1"></div><div><label>补充要求</label><input id="remark"></div></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="createInquiry()">提交询价</button></div>`)}
async function createInquiry(){const customer=document.getElementById('customer').value.trim(),route=document.getElementById('route').value.trim();if(!customer||!route)return toast('请填写客户名称和运输线路',true);const body={customer_name:customer,contact_name:document.getElementById('contact').value,route,transport_mode:document.getElementById('mode').value,cargo_desc:document.getElementById('cargo').value,weight_kg:Number(document.getElementById('weight').value),volume_cbm:Number(document.getElementById('volume').value),remark:document.getElementById('remark').value};const r=await json('/api/inquiries/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});closeModal();toast(r.msg);loadInquiries()}
function shareQuote(q){const copy=`${q.customer_name}\n${q.route}｜${q.channel}\n参考报价：¥${Number(q.amount).toLocaleString()}\n有效期至：${q.validity}`;openModal(`<h3>分享报价</h3><div class="share-preview">${esc(copy).replace(/\n/g,'<br>')}</div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick='copyText(${JSON.stringify(copy)})'>复制分享文案</button></div>`)}
function copyText(text){navigator.clipboard?.writeText(text);closeModal();toast('报价文案已复制')}
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('show')}function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}document.getElementById('modalOverlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()};function toast(msg,error){const el=document.createElement('div');el.textContent=msg;el.style.cssText=`position:fixed;right:20px;top:20px;z-index:500;background:${error?'#dc2626':'#059669'};color:#fff;padding:11px 18px;border-radius:6px`;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}
loadInquiries();
</script>
</body>
</html>

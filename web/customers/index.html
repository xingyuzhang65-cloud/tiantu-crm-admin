<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨境物流CRM - ShareAI</title>

<style data-inline-crm-css>
:root {
    --primary: #1e3a5f;
    --primary-light: #2563eb;
    --accent: #0ea5e9;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg: #f0f4f8;
    --card: #ffffff;
    --text: #1e293b;
    --text-secondary: #64748b;
    --border: #e2e8f0;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
}

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
a { color:var(--primary-light); text-decoration:none; }

/* ── Layout ── */
.app { display:flex; min-height:100vh; }
.sidebar { width:240px; background:var(--primary); color:#fff; flex-shrink:0; position:fixed; top:0; left:0; bottom:0; z-index:100; }
.sidebar-header { padding:20px; border-bottom:1px solid rgba(255,255,255,.1); }
.sidebar-header h2 { font-size:18px; font-weight:700; }
.sidebar-header .sub { font-size:12px; color:rgba(255,255,255,.6); margin-top:4px; }
.sidebar-nav { padding:12px 0; }
.sidebar-nav a { display:flex; align-items:center; gap:10px; padding:12px 20px; color:rgba(255,255,255,.75); font-size:14px; transition:all .2s; }
.sidebar-nav a:hover, .sidebar-nav a.active { background:rgba(255,255,255,.1); color:#fff; }
.sidebar-nav a .icon { font-size:18px; width:22px; text-align:center; }
.sidebar-badge { margin-left:auto; background:var(--danger); color:#fff; font-size:11px; padding:2px 7px; border-radius:10px; }
.main { margin-left:240px; flex:1; padding:24px; min-width:0; }

/* ── Cards ── */
.stats-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin-bottom:24px; }
.stat-card { background:var(--card); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); }
.stat-card .label { font-size:13px; color:var(--text-secondary); margin-bottom:6px; }
.stat-card .value { font-size:28px; font-weight:700; color:var(--primary); }
.stat-card .sub { font-size:12px; color:var(--text-secondary); margin-top:4px; }
.stat-card.accent .value { color:var(--accent); }
.stat-card.success .value { color:var(--success); }
.stat-card.warning .value { color:var(--warning); }
.stat-card.danger .value { color:var(--danger); }

.panel { background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:24px; }
.panel-header { padding:16px 20px; border-bottom:1px solid var(--border); font-weight:600; font-size:15px; display:flex; align-items:center; justify-content:space-between; }
.panel-body { padding:20px; }
.panel-header .action-btn { font-size:13px; color:var(--primary-light); cursor:pointer; background:none; border:none; }

/* ── Tables ── */
.table-wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { text-align:left; padding:10px 14px; font-weight:600; color:var(--text-secondary); background:#f8fafc; border-bottom:1px solid var(--border); white-space:nowrap; }
td { padding:10px 14px; border-bottom:1px solid var(--border); }
tr:hover td { background:#f8fafc; }

/* ── Tags / Badges ── */
.badge { display:inline-block; padding:3px 10px; border-radius:12px; font-size:12px; font-weight:500; }
.badge-green { background:#d1fae5; color:#065f46; }
.badge-yellow { background:#fef3c7; color:#92400e; }
.badge-red { background:#fee2e2; color:#991b1b; }
.badge-blue { background:#dbeafe; color:#1e40af; }
.badge-purple { background:#ede9fe; color:#5b21b6; }
.badge-gray { background:#f1f5f9; color:#475569; }

.status-new { color:var(--accent); }
.status-active { color:var(--success); }
.status-warning { color:var(--warning); }
.status-danger { color:var(--danger); }

/* ── Progress ── */
.progress-bar { height:8px; background:#e2e8f0; border-radius:4px; overflow:hidden; margin-top:6px; }
.progress-fill { height:100%; border-radius:4px; transition:width .3s; }
.progress-green { background:var(--success); }
.progress-yellow { background:var(--warning); }
.progress-red { background:var(--danger); }

/* ── Buttons ── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:6px; font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .2s; }
.btn-primary { background:var(--primary-light); color:#fff; }
.btn-primary:hover { background:#1d4ed8; }
.btn-outline { background:#fff; color:var(--primary-light); border:1px solid var(--primary-light); }
.btn-outline:hover { background:#eff6ff; }
.btn-sm { padding:5px 10px; font-size:12px; }
.btn-danger { background:var(--danger); color:#fff; }
.btn-success { background:var(--success); color:#fff; }

.btn-block { display:block; width:100%; text-align:center; justify-content:center; }

/* ── Form inputs ── */
.form-input { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; box-sizing:border-box; }
.form-textarea { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit; resize:vertical; box-sizing:border-box; }
.form-select { width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; background:#fff; box-sizing:border-box; }
.form-label { display:block; font-size:12px; color:#64748b; margin-bottom:4px; font-weight:500; }
.form-row { margin-top:10px; }

/* ── AI Panel ── */
.ai-chat { max-height:450px; overflow-y:auto; padding:16px; background:#f8fafc; border-radius:8px; margin-bottom:12px; }
.ai-msg { margin-bottom:12px; display:flex; gap:10px; }
.ai-msg.bot .avatar { background:var(--primary-light); color:#fff; }
.ai-msg .avatar { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.ai-msg.bot .content { background:#fff; border:1px solid var(--border); }
.ai-msg .content { padding:10px 14px; border-radius:8px; font-size:13px; line-height:1.7; max-width:80%; }
.ai-msg.user { flex-direction:row-reverse; }
.ai-msg.user .content { background:var(--primary-light); color:#fff; }

.ai-input-area { display:flex; gap:8px; }
.ai-input-area input { flex:1; padding:10px 14px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
.ai-input-area button { padding:10px 20px; background:var(--primary-light); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }

/* ── Modal ── */
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:12px; padding:24px; width:90%; max-width:550px; max-height:80vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.2); }
.modal h3 { margin-bottom:16px; font-size:18px; }
.modal label { display:block; font-size:13px; font-weight:500; margin-bottom:4px; margin-top:12px; }
.modal input, .modal select, .modal textarea { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
.modal textarea { min-height:80px; resize:vertical; }
.modal-actions { margin-top:16px; display:flex; gap:8px; justify-content:flex-end; }

/* ── Two-column ── */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.grid-3 { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
@media(max-width:900px) { .grid-2, .grid-3 { grid-template-columns:1fr; } }

/* ── Timeline ── */
.timeline { position:relative; padding-left:24px; }
.timeline::before { content:''; position:absolute; left:8px; top:4px; bottom:4px; width:2px; background:var(--border); }
.timeline-item { position:relative; padding:8px 0 16px 16px; }
.timeline-item::before { content:''; position:absolute; left:-20px; top:12px; width:10px; height:10px; border-radius:50%; background:var(--primary-light); }
.timeline-item.exception::before { background:var(--danger); }
.timeline-item .time { font-size:11px; color:var(--text-secondary); }
.timeline-item .desc { font-size:13px; margin-top:2px; }

/* ── AI insight card ── */
.insight-card { padding:16px; border-radius:8px; border-left:4px solid var(--primary-light); background:#f0f7ff; margin-bottom:12px; }
.insight-card.danger { border-color:var(--danger); background:#fef2f2; }
.insight-card.success { border-color:var(--success); background:#f0fdf4; }
.insight-card .title { font-weight:600; font-size:14px; margin-bottom:6px; }

.flex-between { display:flex; align-items:center; justify-content:space-between; }
.text-sm { font-size:12px; color:var(--text-secondary); }
.text-muted { color:var(--text-secondary); font-size:13px; }
.mt-2 { margin-top:8px; }
.mt-4 { margin-top:16px; }
.mb-4 { margin-bottom:16px; }
.uppercase { text-transform:uppercase; font-size:11px; letter-spacing:.5px; }

/* ── Route cards ── */
.route-chip { display:inline-block; padding:3px 8px; margin:2px; background:#e0f2fe; color:#0369a1; border-radius:4px; font-size:12px; }

/* ── Spark mini chart ── */
.spark-line { height:40px; display:flex; align-items:flex-end; gap:3px; }
.spark-line .bar { flex:1; background:var(--primary-light); border-radius:2px 2px 0 0; opacity:.8; min-height:3px; }

</style>
</head>

<style>

.table-panel { background:#fff; border:1px solid var(--border); border-radius:8px; overflow:hidden; }

.modal-field input, .modal-field select, .modal-field textarea { width:100%; border:1px solid var(--border); border-radius:6px; padding:9px 10px; font-size:14px; box-sizing:border-box; }

<script>
const TABS = [
  { key: 'my', label: '我的客户' },
  { key: 'pool', label: '公司池' },
  { key: 'expiring', label: '即将掉保', danger: true },
  { key: 'all', label: '全部' },
  { key: 'closed', label: '成交客户' },
];
const FOLLOW_LABELS = {
  INITIAL_VISIT: '初访',
  INTERESTED: '有意向',
  QUOTED: '报价',
  CLOSED: '成交',
  TEMP_HOLD: '暂时搁置',
};
let activeTab = 'my';
let page = 1;
let total = 0;
let tabCounts = {};
let records = [];
let selected = new Set();
let selectedAll = false;

const el = id => document.getElementById(id);
const htmlEscape = v => String(v ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

function renderTabs() {
  el('tabStrip').innerHTML = TABS.map(t => `
    <button class="tab-btn ${t.danger ? 'danger' : ''} ${activeTab === t.key ? 'active' : ''}" onclick="switchTab('${t.key}')">
      <span>${t.label}</span><span class="tab-count">${tabCounts[t.key] || 0}</span>
    </button>
  `).join('');
}

function renderBulkActions() {
  const actionsByTab = {
    my: [
      ['updateStatus', '更新状态'],
      ['transfer', '转移给他人'],
      ['returnPool', '退回客户公海'],
      ['delete', '删除'],
    ],
    pool: [
      ['claim', '领取'],
      ['transfer', '转移给他人'],
      ['delete', '删除'],
    ],
    expiring: [
      ['updateStatus', '更新状态'],
      ['transfer', '转移给他人'],
      ['returnPool', '退回客户公海'],
      ['delete', '删除'],
    ],
    all: [
      ['transfer', '转移给他人'],
      ['delete', '删除'],
    ],
    closed: [
      ['updateStatus', '更新状态'],
      ['transfer', '转移给他人'],
      ['delete', '删除'],
    ],
  };
  el('bulkActions').innerHTML = (actionsByTab[activeTab] || []).map(([key, label]) =>
    `<button class="btn btn-outline btn-sm" onclick="openBatch('${key}')">${label}</button>`
  ).join('') + '<button class="btn btn-outline btn-sm" onclick="placeholderAction(\'自定义表格\')">自定义表格</button>';
}

function updateFilterHelp() {
  const text = {
    my: '我的客户：支持字段、来源、跟进状态、最后跟进时间、负责人范围筛选。',
    pool: '公司池：重点支持领取、转移给他人、变更客户公海等操作；负责人为空。',
    expiring: '即将掉保：按保护到期时间计算，新增有效跟进后会退出该视图。',
    all: '全部：聚合查询视图，不作为真实状态存储。',
    closed: '成交客户：跟进状态为成交，支持按成交时间和负责人维护。',
  };
  el('filterHelp').textContent = text[activeTab] || '';
  el('followStatus').disabled = activeTab === 'pool' || activeTab === 'closed';
  el('lastFollowRange').disabled = activeTab === 'closed';
}

async function fetchData() {
  renderTabs();
  renderBulkActions();
  updateFilterHelp();
  el('customerRows').innerHTML = '<tr><td colspan="10" class="empty-inline">正在加载...</td></tr>';
  const params = new URLSearchParams({
    tab: activeTab,
    page,
    page_size: el('pageSize').value,
    keyword_field: el('keywordField').value,
  });
  for (const [id, key] of [
    ['keywordInput', 'keyword'],
    ['followStatus', 'follow_status'],
    ['sourceFilter', 'source'],
    ['lastFollowRange', 'last_follow_range'],
  ]) {
    const v = el(id).value.trim();
    if (v) params.set(key, v);
  }
  const res = await fetch(`/api/crm/customers?${params.toString()}`).then(r => r.json());
  if (!res.ok) {
    el('customerRows').innerHTML = '<tr><td colspan="10" class="empty-inline">加载失败，请刷新后重试</td></tr>';
    return;
  }
  records = res.records || [];
  total = res.total || 0;
  tabCounts = res.tab_counts || {};
  selectedAll = false;
  selected.clear();
  renderTabs();
  renderRows();
  updateSelectionText();
}

function renderRows() {
  if (!records.length) {
    el('customerRows').innerHTML = '<tr><td colspan="10" class="empty-inline">暂无数据</td></tr>';
    return;
  }
  el('customerRows').innerHTML = records.map(r => {
    const statusClass = r.ownership_status === 'EXPIRING_PROTECTION' ? 'red' : r.ownership_status === 'CLOSED_CUSTOMER' ? 'green' : r.ownership_status === 'COMPANY_POOL' ? 'orange' : 'blue';
    const timeLabel = r.ownership_status === 'CLOSED_CUSTOMER' ? '成交' : '保护到期';
    const timeValue = r.ownership_status === 'CLOSED_CUSTOMER' ? r.closed_at : r.protect_expire_at;
    return `
      <tr>
        <td><input type="checkbox" class="row-check" value="${r.id}" onchange="toggleRow(${r.id}, this.checked)"></td>
        <td>
          <div class="customer-link" onclick="openCustomer(${r.id})">${htmlEscape(r.customer_name)}</div>
          <div class="muted">${htmlEscape(r.company_name)} · ${htmlEscape(r.source || '-')}</div>
          <div class="tag-line">${(r.tags || []).map(t => `<span class="mini-tag">${htmlEscape(t)}</span>`).join('')}</div>
        </td>
        <td><div>${htmlEscape(r.hot_contact?.name || '-')}</div><div class="customer-link" onclick="showHotNumber('${htmlEscape(r.mobile)}')">${htmlEscape(r.masked_mobile || '-')}</div></td>
        <td>${htmlEscape(r.owner || '未分配')}</td>
        <td><span class="mini-tag ${statusClass}">${htmlEscape(r.ownership_label)}</span>${r.pool_name ? `<div class="muted">${htmlEscape(r.pool_name)}</div>` : ''}</td>
        <td><span class="mini-tag blue">${htmlEscape(r.follow_status_label)}</span></td>
        <td><div>${htmlEscape(r.latest_follow?.content || '-')}</div><div class="muted">${fmt(r.last_followup_at)}</div></td>
        <td><div class="muted">${timeLabel}</div><div class="nowrap">${fmt(timeValue)}</div></td>
        <td class="nowrap">${fmt(r.created_at)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="openCustomer(${r.id})">查看</button></td>
      </tr>
    `;
  }).join('');
  el('pageText').textContent = `第 ${page} 页 / 共 ${Math.max(1, Math.ceil(total / Number(el('pageSize').value)))} 页`;
  el('totalText').textContent = `共 ${total} 条`;
}

function fmt(v) {
  if (!v) return '-';
  return String(v).slice(0, 16).replace('T', ' ');
}

function switchTab(tab) {
  activeTab = tab;
  reloadFirstPage();
}

function reloadFirstPage() {
  page = 1;
  fetchData();
}

function clearFilters() {
  ['keywordInput', 'followStatus', 'sourceFilter', 'lastFollowRange'].forEach(id => el(id).value = '');
  el('keywordField').value = 'customer_name';
  reloadFirstPage();
}

function prevPage() {
  if (page > 1) {
    page -= 1;
    fetchData();
  }
}

function nextPage() {
  if (page * Number(el('pageSize').value) < total) {
    page += 1;
    fetchData();
  }
}

function togglePageSelection() {
  const checked = el('checkAll').checked;
  document.querySelectorAll('.row-check').forEach(c => {
    c.checked = checked;
    toggleRow(Number(c.value), checked, false);
  });
  updateSelectionText();
}

function toggleRow(id, checked, update = true) {
  if (checked) selected.add(id);
  else selected.delete(id);
  selectedAll = false;
  if (update) updateSelectionText();
}

function updateSelectionText() {
  el('selectedText').textContent = selectedAll ? `已勾选全部匹配客户 ${total} 个` : `已勾选本页 ${selected.size} 个客户`;
  el('selectAllResultsBtn').style.display = selected.size > 0 && selected.size < total ? 'inline-flex' : 'none';
}

function selectAllResults() {
  selectedAll = true;
  updateSelectionText();
  showToast(`已勾选全部匹配客户 ${total} 个`);
}

function selectedIds() {
  return selectedAll ? records.map(r => r.id) : Array.from(selected);
}

function requireSelection() {
  if (!selectedIds().length) {
    showToast('请先选择需要操作的客户', 'error');
    return false;
  }
  return true;
}

function openBatch(action) {
  if (!requireSelection()) return;
  const ids = selectedIds();
  const titles = { updateStatus: '更新状态', claim: '领取客户', transfer: '转移负责人', returnPool: '退回客户公海', delete: '删除客户' };
  let form = '';
  if (action === 'updateStatus') {
    form = `<div class="modal-field"><label>目标跟进状态</label><select id="batchStatus">
      <option value="INITIAL_VISIT">初访</option><option value="INTERESTED">有意向</option><option value="QUOTED">报价</option><option value="CLOSED">成交</option><option value="TEMP_HOLD">暂时搁置</option>
    </select></div>`;
  } else if (action === 'transfer') {
    form = '<div class="modal-field"><label>目标负责人</label><input id="batchOwner" value="张晓明"></div>';
  } else if (action === 'claim') {
    form = '<div class="modal-field"><label>领取人</label><input id="batchOwner" value="张晓明"></div>';
  } else if (action === 'returnPool') {
    form = '<div class="modal-field"><label>退回原因</label><textarea id="batchReason" placeholder="可选"></textarea></div>';
  } else if (action === 'delete') {
    form = '<div class="modal-field"><label>确认</label><div class="muted">删除后客户将不在当前业务列表展示，是否确认删除？</div></div>';
  }
  openModal(`
    <h3>${titles[action]}</h3>
    <div class="muted">将影响 ${ids.length} 个客户，执行前请确认。</div>
    ${form}
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="runBatch('${action}')">确认执行</button>
    </div>
  `);
}

async function runBatch(action) {
  const endpoint = {
    updateStatus: '/api/crm/customers/batch/update-status',
    claim: '/api/crm/customers/batch/claim',
    transfer: '/api/crm/customers/batch/transfer-owner',
    returnPool: '/api/crm/customers/batch/return-pool',
    delete: '/api/crm/customers/batch/delete',
  }[action];
  const payload = { ids: selectedIds(), operator: '张晓明' };
  if (action === 'updateStatus') payload.status = el('batchStatus').value;
  if (action === 'transfer' || action === 'claim') payload.owner = el('batchOwner').value.trim();
  if (action === 'returnPool') payload.reason = el('batchReason').value.trim();
  const res = await fetch(endpoint, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  }).then(r => r.json());
  closeModal();
  if (res.ok) {
    showToast(res.msg || '操作成功');
    fetchData();
  } else {
    showToast(res.msg || '操作失败', 'error');
  }
}

function openCustomer(id) {
  location.href = `/customer/${id}`;
}

function showHotNumber(phone) {
  if (!phone || phone === '-') return showToast('暂无号码');
  openModal(`<h3>Hot号码</h3><div class="modal-field"><label>完整手机号</label><input value="${phone}" readonly></div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button></div>`);
}

function placeholderAction(name) {
  showToast(`${name}入口已保留，外部服务待接入`);
}

function exportList() {
  showToast('导出任务已创建，请稍后查看下载结果');
}

let searchTimer = null;
el('keywordInput').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(reloadFirstPage, 300);
});

renderTabs();
renderBulkActions();
updateFilterHelp();
fetchData();
</script>

  </main>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ── Modal utils ──
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Toast ──
function showToast(msg, type='success') {
  let el = document.createElement('div');
  el.style.cssText = `position:fixed;top:20px;right:20px;z-index:999;padding:12px 20px;
    border-radius:8px;color:#fff;font-size:14px;animation:fadeIn .3s;
    background:${type==='error'?'#ef4444':'#10b981'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(() => el.remove(), 300); }, 2500);
}

// ── API helpers ──
async function apiGet(url) {
  let r = await fetch(url);
  return r.json();
}
async function apiPost(url) {
  let r = await fetch(url, {method:'POST'});
  return r.json();
}
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>运踪与异常 - 跨境物流CRM</title>
<link rel="stylesheet" href="/tiantu-crm-admin/web/static/css/style.css"><script src="/tiantu-crm-admin/web/static/admin-pages.js"></script>
<style>
body{background:#f0f4f8}.main{width:100%;margin:0;padding:24px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px}.head h1{font-size:22px}.head p{font-size:12px;color:#64748b}.segment{display:flex;width:max-content;padding:4px;background:#e2e8f0;border-radius:7px;margin-bottom:16px}.segment button{border:0;background:transparent;padding:8px 25px;border-radius:5px;color:#64748b;cursor:pointer}.segment button.active{background:#fff;color:#1d4ed8;font-weight:600}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{flex:1;min-width:260px;max-width:430px}.chip{border:1px solid #e2e8f0;background:#fff;color:#64748b;padding:7px 12px;border-radius:5px;cursor:pointer}.chip.active{border-color:#2563eb;background:#eff6ff;color:#1d4ed8}.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.order-card{background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:17px;cursor:pointer}.order-card.severe{border-left:4px solid #dc2626}.card-top,.route-row,.card-foot,.exception-stats{display:flex;align-items:center}.card-top,.card-foot{justify-content:space-between}.tracking-no{font-family:ui-monospace,monospace;font-weight:650}.customer{font-size:13px;color:#64748b;margin-top:3px}.route-row{gap:12px;margin:19px 0 11px}.location{width:82px;font-size:12px;font-weight:600}.location:last-child{text-align:right}.progress-wrap{height:7px;flex:1;background:#e2e8f0;border-radius:4px;overflow:hidden}.progress{height:100%;background:#0ea5e9;border-radius:4px}.route-detail{font-size:12px;color:#64748b}.latest{margin-top:12px;padding:10px;background:#f8fafc;border-radius:5px;font-size:12px;min-height:40px}.card-foot{margin-top:12px}.actions{display:flex;gap:6px}.subscribed{color:#047857!important;border-color:#6ee7b7!important}.exception-stats{gap:12px;margin-bottom:16px}.exception-stat{min-width:170px;padding:16px 18px;background:#fff;border:1px solid #e2e8f0;border-radius:7px}.exception-stat strong{font-size:26px;display:block}.exception-stat.severe strong{color:#dc2626}.exception-stat.warning strong{color:#d97706}.hidden{display:none!important}.timeline-event{position:relative;padding:0 0 20px 28px}.timeline-event::before{content:'';position:absolute;left:6px;top:5px;width:9px;height:9px;background:#2563eb;border-radius:50%}.timeline-event::after{content:'';position:absolute;left:10px;top:16px;bottom:0;width:1px;background:#cbd5e1}.timeline-event:last-child::after{display:none}.timeline-event.exception::before{background:#dc2626}.event-time{font-size:11px;color:#94a3b8}.event-place{font-weight:650;font-size:13px}.event-desc{font-size:12px;color:#64748b;margin-top:2px}.detail-info{padding:13px;background:#f8fafc;border-radius:6px;margin-bottom:17px}.empty{grid-column:1/-1;text-align:center;padding:70px;color:#94a3b8}@media(max-width:850px){.main{padding:16px}.order-grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="main">
<div class="head"><div><h1>运踪与异常预警</h1><p>同步 APP 端运单节点、订阅状态和异常工单</p></div><span class="text-muted">节点数据更新于 08/17 09:30</span></div>
<div class="segment"><button class="active" onclick="setTab('tracking',this)">在途追踪</button><button onclick="setTab('exception',this)">异常预警</button></div>
<section id="trackingView"><div class="toolbar"><input id="keyword" class="form-input search" placeholder="搜索单号、客户、线路或货物" oninput="loadOrders()"><button class="chip active" data-status="" onclick="setFilter('',this)">全部</button><button class="chip" data-status="transit" onclick="setFilter('transit',this)">海运在途</button><button class="chip" data-status="air_transit" onclick="setFilter('air_transit',this)">空运在途</button><button class="chip" data-status="last_mile" onclick="setFilter('last_mile',this)">尾程派送中</button></div><div id="orderList" class="order-grid"></div></section>
<section id="exceptionView" class="hidden"><div id="exceptionStats" class="exception-stats"></div><div id="exceptionList" class="order-grid"></div></section>
</main><div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<script>
let statusFilter='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function json(url,o){return fetch(url,o).then(r=>r.json())}
function setTab(tab,b){document.querySelectorAll('.segment button').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('trackingView').classList.toggle('hidden',tab!=='tracking');document.getElementById('exceptionView').classList.toggle('hidden',tab!=='exception');tab==='exception'&&loadExceptions()}
function setFilter(s,b){statusFilter=s;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));loadOrders()}
function card(o,exception=false){return `<article class="order-card ${o.exception_level==='severe'?'severe':''}" onclick="detail(${o.id})"><div class="card-top"><div><div class="tracking-no">${esc(o.tracking_number)}</div><div class="customer">${esc(o.customer_name)}</div></div>${exception?`<span class="badge ${o.exception_level==='severe'?'badge-red':'badge-yellow'}">${esc(o.exception_type)}</span>`:`<span class="badge badge-blue">${esc(o.status_label)}</span>`}</div><div class="route-row"><span class="location">${esc(o.origin)}</span><div class="progress-wrap"><div class="progress" style="width:${o.progress}%"></div></div><span class="location">${esc(o.destination)}</span></div><div class="route-detail">${esc(o.route_detail)} · ${Number(o.weight_kg).toLocaleString()} kg · ${o.volume_cbm} m³</div><div class="latest">${esc(o.latest_event)}</div><div class="card-foot"><span class="text-sm">ETA ${o.eta||'-'}</span><div class="actions"><button class="btn btn-outline btn-sm" onclick="event.stopPropagation();copyNo('${esc(o.tracking_number)}')">复制</button><button class="btn btn-outline btn-sm ${o.subscribed?'subscribed':''}" onclick="event.stopPropagation();subscribe(${o.id})">${o.subscribed?'已订阅':'订阅'}</button></div></div></article>`}
async function loadOrders(){const q=new URLSearchParams({status:statusFilter,keyword:document.getElementById('keyword').value});const r=await json('/api/orders/list?'+q);document.getElementById('orderList').innerHTML=r.orders.length?r.orders.map(o=>card(o)).join(''):'<div class="empty">暂无符合条件的在途运单</div>'}
async function loadExceptions(){const r=await json('/api/orders/exceptions');document.getElementById('exceptionStats').innerHTML=`<div class="exception-stat severe"><strong>${r.stats.severe}</strong><span>严重异常</span></div><div class="exception-stat warning"><strong>${r.stats.warning}</strong><span>延误预警</span></div>`;document.getElementById('exceptionList').innerHTML=r.orders.map(o=>card(o,true)).join('')}
async function subscribe(id){const r=await json('/api/orders/'+id+'/subscribe',{method:'POST'});toast(r.msg);loadOrders();loadExceptions()}
async function detail(id){const r=await json('/api/tracking/'+id);const o=r.order;openModal(`<h3>运踪详情</h3><div class="detail-info"><div class="tracking-no">${esc(o.tracking_number)}</div><div class="route-detail mt-2">${esc(o.route_detail)}</div><div class="flex-between mt-2"><span>ETD ${o.etd} → ETA ${o.eta}</span><span class="badge badge-blue">${esc(o.status_label)}</span></div></div><div>${r.events.map(e=>`<div class="timeline-event ${e.event_type==='exception'?'exception':''}"><div class="event-time">${esc(e.time)}</div><div class="event-place">${esc(e.location)}</div><div class="event-desc">${esc(e.description)}</div></div>`).join('')}</div><div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">关闭</button><button class="btn btn-primary" onclick="copyNo('${esc(o.tracking_number)}');closeModal()">复制单号</button></div>`)}
function copyNo(no){navigator.clipboard?.writeText(no);toast('运单号已复制')}
function openModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modalOverlay').classList.add('show')}function closeModal(){document.getElementById('modalOverlay').classList.remove('show')}document.getElementById('modalOverlay').onclick=e=>{if(e.target===e.currentTarget)closeModal()};function toast(m){const e=document.createElement('div');e.textContent=m;e.style.cssText='position:fixed;right:20px;top:20px;z-index:500;background:#059669;color:white;padding:11px 18px;border-radius:6px';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}loadOrders();
</script></body></html>
